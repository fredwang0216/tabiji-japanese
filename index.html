<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<title>Tabiji — 旅行日语</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#171717;--muted:#77736d;--accent:#e94b35;--soft:#f2e7e2;--line:#e9e3dc;--green:#2f8f67}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans SC",sans-serif}button{font:inherit;border:0;cursor:pointer} .app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(86px + env(safe-area-inset-bottom))}
header{padding:22px 2px 18px;display:flex;justify-content:space-between;align-items:center} .brand{font-weight:800;font-size:24px;letter-spacing:-.5px}.brand span{color:var(--accent)}.streak{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:20px;font-size:13px}
.hero{background:#191919;color:white;border-radius:28px;padding:26px 24px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"旅";position:absolute;right:-8px;bottom:-35px;font-size:150px;font-weight:900;color:#ffffff0d}.eyebrow{font-size:12px;color:#d7a49b;font-weight:700;letter-spacing:1px}.hero h1{font-size:32px;line-height:1.12;margin:8px 0}.hero p{color:#c9c9c9;margin:0 0 20px;line-height:1.5}.primary{background:var(--accent);color:#fff;padding:13px 18px;border-radius:14px;font-weight:700}
.section-title{font-size:18px;font-weight:800;margin:22px 2px 12px}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scene{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left;min-height:128px}.scene .emoji{font-size:28px}.scene b{display:block;margin-top:12px;font-size:16px}.scene small{display:block;color:var(--muted);margin-top:4px}
.lesson{display:none}.lesson.active{display:block}.topbar{display:flex;align-items:center;gap:10px;margin:12px 0 18px}.back{background:#fff;border:1px solid var(--line);width:42px;height:42px;border-radius:14px}.lesson-title{font-size:23px;font-weight:800}.progress{height:5px;background:#e4ddd5;border-radius:9px;margin:8px 0 20px}.progress i{display:block;height:100%;width:25%;background:var(--accent);border-radius:9px}.phrase-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;margin-bottom:14px}.jp{font-size:31px;font-weight:700;line-height:1.35}.romaji{color:#8b867f;margin-top:8px}.cn{font-size:18px;margin-top:14px}.listen{margin-top:20px;background:#f3ece8;border-radius:15px;padding:12px 15px;color:#a83829;font-weight:700}.choices{display:grid;gap:10px;margin-top:14px}.choice{background:#fff;border:1px solid var(--line);padding:15px;border-radius:15px;text-align:left}.choice.correct{border-color:var(--green);background:#edf8f2}.choice.wrong{border-color:#d85a4a;background:#fff0ed}
.feedback{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.feedback.show{display:block}.feedback-title{font-weight:800;font-size:16px}
.dialogue-good{border-color:var(--green);background:#edf8f2}
.dialogue-bad{border-color:#d85a4a;background:#fff0ed}
.dialogue-jp{font-size:22px;font-weight:800;margin-top:8px}
.dialogue-cn{color:var(--muted);margin-top:6px;line-height:1.5}
.dialogue-why{color:#8b867f;font-size:14px;margin-top:4px;font-style:italic}
.chat-listen{display:block;margin-top:10px;background:#fff;border:1px solid var(--line);color:#a83829;border-radius:11px;padding:8px 11px;font-size:13px;font-weight:700}
.chat-listen:active{transform:scale(.98)}.feedback-why{color:var(--muted);font-size:14px;line-height:1.55;margin-top:8px}
.repeat{margin-top:14px;background:#191919;color:#fff;padding:13px 16px;border-radius:14px;font-weight:700;width:100%}
.repeat.done{background:var(--green)}.repeat-status{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;min-height:20px}
.chat{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;min-height:360px}.bubble{max-width:85%;padding:12px 14px;border-radius:17px;margin:8px 0;line-height:1.45}.ai{background:#f0ece7}.me{background:#191919;color:#fff;margin-left:auto}.mic{width:70px;height:70px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:block;margin:18px auto 8px;box-shadow:0 8px 20px #e94b3533}.status{text-align:center;color:var(--muted);font-size:13px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(484px,calc(100% - 28px));background:#fffdfb;border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;justify-content:space-around;box-shadow:0 10px 30px #0000000b}.nav button{background:none;padding:9px 18px;color:#8a867f;font-size:12px}.nav button.active{color:var(--ink);font-weight:800}.nav .ni{display:block;font-size:20px;margin-bottom:2px}
.view{display:none}.view.active{display:block}.tip{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
@media(max-width:360px){.jp{font-size:27px}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">tabiji<span>·</span></div><div class="streak">🔥 3 天</div></header>

<section id="home" class="view active">
<div class="hero"><div class="eyebrow">日本旅行 · DAY 1</div><h1>今天开始，<br>开口说日语。</h1><p>专为旅行设计。学完就能在机场、餐厅、酒店和车站直接用。</p><button class="primary" onclick="openScene('restaurant')">继续学习 →</button></div>
<div class="section-title">旅行场景</div>
<div class="scenes">
<button class="scene" onclick="openScene('restaurant')"><div class="emoji">🍜</div><b>餐厅</b><small>点餐、结账、问推荐</small></button>
<button class="scene" onclick="openScene('hotel')"><div class="emoji">🏨</div><b>酒店</b><small>入住、行李、退房</small></button>
<button class="scene" onclick="openScene('transport')"><div class="emoji">🚆</div><b>交通</b><small>车站、买票、问路</small></button>
<button class="scene" onclick="openScene('shopping')"><div class="emoji">🛍️</div><b>购物</b><small>价格、试穿、付款</small></button>
</div>
<div class="section-title">今日目标</div><div class="phrase-card"><b>5 句旅行日语</b><div class="tip">先听 → 跟读 → 选择正确表达 → 最后用 AI 情景对话。</div></div>
</section>

<section id="lesson" class="view lesson">
<div class="topbar"><button class="back" onclick="goHome()">‹</button><div class="lesson-title" id="lessonTitle"></div></div>
<div class="progress"><i id="progress"></i></div>
<div class="phrase-card"><div class="jp" id="jp"></div><div class="romaji" id="romaji"></div><div class="cn" id="cn"></div><button class="listen" onclick="speak()">🔊 听日语</button></div>
<div class="section-title">你会怎么说？</div><div class="choices" id="choices"></div>
<div id="feedback" class="feedback">
  <div class="feedback-title" id="feedbackTitle"></div>
  <div class="feedback-why" id="feedbackWhy"></div>
  <button id="repeatBtn" class="repeat" onclick="repeatPhrase()">🎙️ 说一遍</button>
  <div id="repeatStatus" class="repeat-status"></div>
</div>
<div id="nextWrap" style="display:none;margin-top:14px"><button class="primary" style="width:100%" onclick="nextPhrase()">下一句 →</button></div>
</section>

<section id="practice" class="view">
<div class="topbar"><button class="back" onclick="goHome()">‹</button><div class="lesson-title">情景对话</div></div>
<div class="phrase-card"><b>🍜 你正在东京餐厅</b><div class="tip">我来当店员，你用日语回答。先试着说出来。</div></div>
<div class="chat" id="chat"><div class="bubble ai">いらっしゃいませ！<br>何名様ですか？<button class="chat-listen" onclick="speakDialogueQuestion(0)">🔊 再听一次</button></div><div class="bubble ai" style="font-size:13px">（欢迎光临！请问几位？）</div></div>
<div id="dialogueFeedback" class="feedback"></div>
<button class="mic" id="mic" onclick="startVoice()">🎙️</button><div class="status" id="status">点击麦克风，用日语回答</div>
<div class="tip" style="text-align:center">支持 iPhone Safari 的语音识别；也可以直接输入。</div>
</section>

<section id="phrasebook" class="view">
<div class="section-title" style="margin-top:8px">旅行短语库</div>
<div id="phraseList"></div>
</section>

<nav class="nav"><button class="active" onclick="showView('home',this)"><span class="ni">⌂</span>学习</button><button onclick="showView('practice',this)"><span class="ni">◉</span>对话</button><button onclick="showView('phrasebook',this)"><span class="ni">▤</span>短语</button></nav>
</div>
<script>
const data={
restaurant:{title:"餐厅 · 点餐",phrases:[
["すみません。","Sumimasen.","不好意思 / 服务员！",["すみません。","ありがとうございます。","いただきます。"],0],
["おすすめは何ですか？","Osusume wa nan desu ka?","有什么推荐的吗？",["おすすめは何ですか？","お会計お願いします。","これください。"],0],
["これをください。","Kore o kudasai.","请给我这个。",["これをください。","これはいくらですか？","大丈夫です。"],0],
["お会計お願いします。","O-kaikei onegai shimasu.","请结账。",["お会計お願いします。","ごちそうさまでした。","予約しています。"],0],
["ごちそうさまでした。","Gochisōsama deshita.","谢谢款待。",["おはようございます。","ごちそうさまでした。","いってきます。"],1]]},
hotel:{title:"酒店 · 入住",phrases:[
["予約しています。","Yoyaku shiteimasu.","我有预订。",["予約しています。","チェックアウトします。","荷物を預けたいです。"],0],
["チェックインお願いします。","Chekku-in onegai shimasu.","我要办理入住。",["チェックインお願いします。","おすすめは何ですか？","これください。"],0],
["Wi-Fiのパスワードは何ですか？","Wi-Fi no pasuwādo wa nan desu ka?","Wi-Fi 密码是什么？",["部屋はどこですか？","Wi-Fiのパスワードは何ですか？","駅はどこですか？"],1],
["荷物を預けたいです。","Nimotsu o azuketai desu.","我想寄存行李。",["荷物を預けたいです。","予約しています。","大丈夫です。"],0]]},
transport:{title:"交通 · 车站",phrases:[
["東京駅はどこですか？","Tōkyō-eki wa doko desu ka?","东京站在哪里？",["東京駅はどこですか？","これは何ですか？","何名様ですか？"],0],
["この電車は新宿に行きますか？","Kono densha wa Shinjuku ni ikimasu ka?","这班电车去新宿吗？",["切符はいくらですか？","この電車は新宿に行きますか？","予約しています。"],1],
["切符を一枚ください。","Kippu o ichimai kudasai.","请给我一张票。",["切符を一枚ください。","これをください。","お会計お願いします。"],0]]},
shopping:{title:"购物 · 买东西",phrases:[
["これはいくらですか？","Kore wa ikura desu ka?","这个多少钱？",["これはいくらですか？","おすすめは何ですか？","大丈夫です。"],0],
["これを試着してもいいですか？","Kore o shichaku shite mo ii desu ka?","可以试穿这个吗？",["これを試着してもいいですか？","これをください。","予約しています。"],0],
["カードでお願いします。","Kādo de onegai shimasu.","请刷卡。",["現金でお願いします。","カードでお願いします。","お会計お願いします。"],1]]}
};
let scene="restaurant",idx=0;
let lastSpeechEnd=0;
let activeRecognition=null;
function showView(id,btn){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');}
function openScene(s){scene=s;idx=0;renderPhrase();showView('lesson');}
function goHome(){showView('home',document.querySelector('.nav button'))}
function renderPhrase(){const p=data[scene].phrases[idx];document.getElementById('lessonTitle').textContent=data[scene].title;document.getElementById('jp').textContent=p[0];document.getElementById('romaji').textContent=p[1];document.getElementById('cn').textContent=p[2];document.getElementById('progress').style.width=((idx+1)/data[scene].phrases.length*100)+'%';document.getElementById('nextWrap').style.display='none';
document.getElementById('feedback').classList.remove('show');
document.getElementById('feedbackTitle').textContent='';
document.getElementById('feedbackWhy').textContent='';
document.getElementById('repeatStatus').textContent='';
document.getElementById('repeatBtn').className='repeat';
document.getElementById('repeatBtn').textContent='🎙️ 说一遍';
const c=document.getElementById('choices');c.innerHTML='';p[3].forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(b,i===p[4]);c.appendChild(b)})}
function answer(btn,ok){
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  const p=data[scene].phrases[idx];
  const correctBtn=document.querySelectorAll('.choice')[p[4]];
  if(ok){
    document.getElementById('nextWrap').style.display='block';
    document.getElementById('feedback').classList.remove('show');
    speak();
  }else{
    setTimeout(()=>{
      correctBtn.classList.add('correct');
      document.getElementById('feedback').classList.add('show');
      document.getElementById('feedbackTitle').textContent='记住这一句：'+p[0];
      document.getElementById('feedbackWhy').textContent='意思：'+p[2]+'  ·  旅行时直接说这句话就可以。先听一遍，再自己说一遍。';
      speak();
    },250);
  }
}

function repeatPhrase(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const status=document.getElementById('repeatStatus');
  const btn=document.getElementById('repeatBtn');
  const target=data[scene].phrases[idx][0];
  if(!SR){
    status.textContent='当前 Safari 不支持语音识别，请直接跟读。';
    return;
  }
  if(activeRecognition){try{activeRecognition.abort()}catch(e){} activeRecognition=null}
  speechSynthesis.cancel();
  btn.disabled=true; btn.textContent='🎙️ 准备中…'; status.textContent='准备麦克风…';
  setTimeout(()=>{
    const r=new SR(); activeRecognition=r;
    r.lang='ja-JP';r.interimResults=false;r.continuous=false;r.maxAlternatives=3;
    r.onstart=()=>{btn.textContent='🎙️ 正在听…';status.textContent='请说：'+target};
    r.onresult=e=>{
      const heard=e.results[0][0].transcript.trim();
      activeRecognition=null;
      const normalize=s=>s.replace(/[。！？!?、\s]/g,'');
      const ok=normalize(heard)===normalize(target) || normalize(heard).includes(normalize(target).slice(0,Math.max(2,Math.floor(normalize(target).length*.65))));
      if(ok){
        btn.className='repeat done';btn.textContent='✓ 说对了！';status.textContent='识别到：'+heard;
        document.getElementById('nextWrap').style.display='block';
        const u=new SpeechSynthesisUtterance(target);u.lang='ja-JP';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u);
      }else{
        btn.disabled=false;btn.className='repeat';btn.textContent='🎙️ 再说一遍';
        status.textContent='听到：「'+heard+'」  再试一次。';
      }
    };
    r.onerror=e=>{
      activeRecognition=null;btn.disabled=false;btn.className='repeat';btn.textContent='🎙️ 再说一遍';
      status.textContent=e.error==='no-speech'?'没有听到声音，再试一次。':(e.error==='not-allowed'?'麦克风权限未开启。':'识别失败，再试一次。');
    };
    r.onend=()=>{if(activeRecognition===r)activeRecognition=null};
    try{r.start()}catch(e){activeRecognition=null;btn.disabled=false;btn.textContent='🎙️ 再说一遍';status.textContent='启动失败，再试一次。'}
  },700);
}
function nextPhrase(){if(idx<data[scene].phrases.length-1){idx++;renderPhrase()}else{showView('practice');}}
function speak(){
  const u=new SpeechSynthesisUtterance(data[scene].phrases[idx][0]);
  u.lang='ja-JP';u.rate=.82;
  u.onend=()=>{lastSpeechEnd=Date.now()};
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
const dialogueTurns=[
  {
    question:'何名様ですか？',
    questionRomaji:'Nan-mei-sama desu ka?',
    questionChinese:'请问几位？',
    answer:'2人です。',
    answerRomaji:'Futari desu.',
    alternatives:["二人です。","ふたりです。","2人です","二人です","ふたりです"],
    chinese:'两位。',
    next:'ご注文はお決まりですか？',
    hint:'人数を答えます。'
  },
  {
    question:'ご注文はお決まりですか？',
    questionRomaji:'Go-chūmon wa okimari desu ka?',
    questionChinese:'决定好点什么了吗？',
    answer:'ラーメンを一つください。',
    answerRomaji:'Rāmen o hitotsu kudasai.',
    alternatives:[],
    chinese:'请给我一碗拉面。',
    next:'おすすめは何ですか？',
    hint:'ラーメンを注文します。'
  },
  {
    question:'おすすめは何ですか？',
    questionRomaji:'Osusume wa nan desu ka?',
    questionChinese:'有什么推荐的吗？',
    answer:'ラーメンがおすすめです。',
    answerRomaji:'Rāmen ga osusume desu.',
    alternatives:[],
    chinese:'推荐拉面。',
    next:'飲み物は何にしますか？',
    hint:'推荐拉面即可。'
  },
  {
    question:'飲み物は何にしますか？',
    questionRomaji:'Nomimono wa nani ni shimasu ka?',
    questionChinese:'饮料要什么？',
    answer:'お水をお願いします。',
    answerRomaji:'O-mizu o onegai shimasu.',
    alternatives:[],
    chinese:'请给我水。',
    next:'辛いものは大丈夫ですか？',
    hint:'要水可以这样说。'
  },
  {
    question:'辛いものは大丈夫ですか？',
    questionRomaji:'Karai mono wa daijōbu desu ka?',
    questionChinese:'辣的食物可以吗？',
    answer:'大丈夫です。',
    answerRomaji:'Daijōbu desu.',
    alternatives:[],
    chinese:'没问题。',
    next:'ご注文は以上ですか？',
    hint:'简单回答“大丈夫です”。'
  },
  {
    question:'ご注文は以上ですか？',
    questionRomaji:'Go-chūmon wa ijō desu ka?',
    questionChinese:'就这些了吗？',
    answer:'はい、以上です。',
    answerRomaji:'Hai, ijō desu.',
    alternatives:[],
    chinese:'是的，就这些。',
    next:'お会計はどうしますか？',
    hint:'表示“就这些”。'
  },
  {
    question:'お会計はどうしますか？',
    questionRomaji:'O-kaikei wa dō shimasu ka?',
    questionChinese:'怎么付款？',
    answer:'カードでお願いします。',
    answerRomaji:'Kādo de onegai shimasu.',
    alternatives:[],
    chinese:'请刷卡。',
    next:'ありがとうございます！',
    hint:'表示用信用卡付款。'
  }
];
let dialogueTurn=0;

function speakDialogueQuestion(turnIndex){
  const turn=dialogueTurns[turnIndex]||dialogueTurns[0];
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(turn.question);
  u.lang='ja-JP';u.rate=.78;
  u.onend=()=>{lastSpeechEnd=Date.now()};
  speechSynthesis.speak(u);
}
function normalizeJapanese(s){
  return s.replace(/[。！？!?、\s]/g,'').replace(/[0-9]/g,m=>String.fromCharCode(m.charCodeAt(0)+0));
}
function normalizeJapanese(s){
  return s.replace(/[。！？!?、\s]/g,'');
}
function evaluateDialogue(heard,turn){
  const h=normalizeJapanese(heard);
  const all=[turn.answer,...turn.alternatives].map(normalizeJapanese);
  if(all.includes(h)) return true;
  const rules=[
    [/ふたり|二人|2人/,/です/],
    [/ラーメン/,/ください|お願い/],
    [/ラーメン/,/おすすめ/],
    [/水|お水/,/ください|お願い/],
    [/大丈夫/,/大丈夫/],
    [/以上|はい/,/以上|はい/],
    [/カード/,/お願い|で/]
  ];
  const rule=rules[dialogueTurn];
  return rule ? rule.every(re=>re.test(h)) : false;
}
function showDialogueFeedback(ok,heard,turn){
  const box=document.getElementById('dialogueFeedback');
  box.className='feedback show '+(ok?'dialogue-good':'dialogue-bad');
  box.innerHTML=
    '<div class="feedback-title">'+(ok?'✓ 说对了！':'△ 可以再练一次')+'</div>'+
    '<div class="feedback-why">店员问：</div>'+
    '<div class="dialogue-jp">'+turn.question+'</div>'+
    '<div class="dialogue-why">'+turn.questionRomaji+'</div>'+
    '<div class="dialogue-cn">'+turn.questionChinese+'</div>'+
    '<div class="feedback-why" style="margin-top:12px">你说：</div>'+
    '<div class="dialogue-jp">'+escapeHtml(heard)+'</div>'+
    '<div class="feedback-why">推荐回答：</div>'+
    '<div class="dialogue-jp">'+turn.answer+'</div>'+
    '<div class="dialogue-why">'+turn.answerRomaji+'</div>'+
    '<div class="dialogue-cn">'+turn.chinese+'</div>'+
    (ok?'':'<div class="feedback-why" style="margin-top:10px">'+turn.hint+'</div>');
}
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('status').textContent='当前浏览器没有语音识别，请直接输入文字。';return}
  if(activeRecognition){try{activeRecognition.abort()}catch(e){} activeRecognition=null}
  speechSynthesis.cancel();
  const turn=dialogueTurns[dialogueTurn]||dialogueTurns[0];
  const status=document.getElementById('status');
  const mic=document.getElementById('mic');
  status.textContent='准备麦克风…'; mic.disabled=true;
  setTimeout(()=>{
    const r=new SR(); activeRecognition=r;
    r.lang='ja-JP';r.interimResults=false;r.continuous=false;r.maxAlternatives=3;
    r.onstart=()=>{status.textContent='正在听，请回答：「'+turn.question+'」';mic.disabled=false};
    r.onresult=e=>{
      const heard=e.results[0][0].transcript.trim();
      activeRecognition=null;
      const ok=evaluateDialogue(heard,turn);
      document.getElementById('chat').insertAdjacentHTML('beforeend','<div class="bubble me">'+escapeHtml(heard)+'</div>');
      status.textContent=ok?'✓ 回答正确':'需要再练一次';
      showDialogueFeedback(ok,heard,turn);
      if(ok){
        setTimeout(()=>{
          const isLast=dialogueTurn>=dialogueTurns.length-1;
          const nextText=isLast?'ありがとうございます！':turn.next;
          document.getElementById('chat').insertAdjacentHTML('beforeend','<div class="bubble ai">いいですね！😊<br>'+nextText+(isLast?'':'<button class="chat-listen" onclick="speakDialogueQuestion('+dialogueTurn+')">🔊 再听一次</button>')+'</div>');
          const u=new SpeechSynthesisUtterance('いいですね！'+nextText);
          u.lang='ja-JP';u.rate=.84;u.onend=()=>{lastSpeechEnd=Date.now()};
          speechSynthesis.cancel();speechSynthesis.speak(u);
          dialogueTurn++;
          if(isLast){
            status.textContent='🎉 餐厅对话完成！';
            mic.disabled=true;
          }
        },700);
      }
    };
    r.onerror=e=>{
      activeRecognition=null;mic.disabled=false;
      status.textContent=e.error==='no-speech'?'没有听到声音，再试一次。':(e.error==='not-allowed'?'麦克风权限未开启。':'识别失败，再试一次。');
    };
    r.onend=()=>{if(activeRecognition===r)activeRecognition=null};
    try{r.start()}catch(e){activeRecognition=null;mic.disabled=false;status.textContent='启动失败，再试一次。'}
  },700);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function buildPhrasebook(){const el=document.getElementById('phraseList');Object.values(data).forEach(group=>group.phrases.forEach(p=>{const d=document.createElement('div');d.className='phrase-card';d.innerHTML='<div class="jp">'+p[0]+'</div><div class="romaji">'+p[1]+'</div><div class="cn">'+p[2]+'</div><button class="listen" onclick="speakText('+JSON.stringify(p[0])+')">🔊 听日语</button>';el.appendChild(d)}))}
function speakText(t){
  const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.82;
  u.onend=()=>{lastSpeechEnd=Date.now()};
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
buildPhrasebook();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body></html>
